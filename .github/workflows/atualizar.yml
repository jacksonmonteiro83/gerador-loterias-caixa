name: Atualizar resultados diarios

on:
  schedule:
    # 06:00 UTC = 03:00 horário de Brasília
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      completo:
        description: "Backfill: baixar TODOS os concursos que faltam (use uma vez; pode levar dezenas de minutos)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atualizar-resultados
  cancel-in-progress: false

jobs:
  atualizar-e-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Testes (estatística, ETL e paridade JS/Python)
        run: python -m pytest -q
      - name: Sincronizar histórico com o loterias-dashboard
        # a base diária do repositório loterias-dashboard (todos os concursos,
        # com ganhadores) vira a fonte principal; se falhar, segue com o que
        # já está versionado em data/historico/ e com a API da Caixa
        continue-on-error: true
        run: python scripts/sincronizar_base.py
      - name: Completar com concursos novos da API da Caixa
        # o SQLite nasce vazio a cada execução; o histórico acumulado vem de
        # data/historico/*.jsonl e só o que falta é baixado
        run: |
          if [[ "${{ inputs.completo }}" == "true" ]]; then
            python main.py --atualizar --completo
          else
            python main.py --atualizar
          fi
      - name: Validar e reexportar dashboard
        # falha (exit 3) se houver dezena fora da faixa, duplicata ou tamanho errado
        run: python scripts/export_dashboard.py
      - name: Publicar dados atualizados no repositório
        id: publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --short)" ]]; then
            git add -A
            git commit -m "chore: resultados de $(TZ=America/Sao_Paulo date +%d/%m/%Y)"
            # outro commit pode ter entrado no main durante a execução (o backfill
            # demora): integra e tenta de novo em vez de falhar com "fetch first"
            for tentativa in 1 2 3 4; do
              git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && break
              echo "push rejeitado (tentativa $tentativa); tentando de novo"
              sleep $((tentativa * 5))
              [[ $tentativa == 4 ]] && exit 1
            done
            echo "atualizado=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nenhum concurso novo desde a última execução."
            echo "atualizado=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publicar no GitHub Pages
        if: steps.publicar.outputs.atualizado == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Empacotar dashboard
        if: steps.publicar.outputs.atualizado == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
      - name: Fazer deploy
        if: steps.publicar.outputs.atualizado == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
