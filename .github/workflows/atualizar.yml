name: Atualizar resultados diarios

on:
  schedule:
    # 06:00 UTC = 03:00 horário de Brasília
    - cron: "0 6 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atualizar-resultados
  cancel-in-progress: false

jobs:
  atualizar-e-publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Baixar concursos novos da Caixa
        run: python main.py --atualizar
      - name: Reexportar dashboard
        run: python scripts/export_dashboard.py
      - name: Publicar dados atualizados no repositório
        id: publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --short)" ]]; then
            git add -A
            git commit -m "chore: resultados de $(TZ=America/Sao_Paulo date +%d/%m/%Y)"
            git push
            echo "atualizado=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nenhum concurso novo desde a última execução."
            echo "atualizado=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publicar no GitHub Pages
        if: steps.publicar.outputs.atualizado == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Empacotar dashboard
        if: steps.publicar.outputs.atualizado == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
      - name: Fazer deploy
        if: steps.publicar.outputs.atualizado == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
